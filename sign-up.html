<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1 class="h2 fw-bold mb-4 text-center">Netflix , Registration</h1>
    <form id="registerForm" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" required minlength="3">
        <div class="invalid-feedback">Username must be at least 3 characters.</div>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" required>
        <div class="invalid-feedback">Please enter a valid email.</div>
      </div>
      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required minlength="6">
        <div class="invalid-feedback">Password must be at least 6 characters.</div>
      </div>
      <div id="msg" class="alert d-none" role="alert"></div>
      <button type="submit" class="btn btn-nf w-100 py-2">REGISTER</button>
    </form>
    <p class="mt-4 mb-0 text-center">Already have an account? <a href="sign-in.html">Login</a></p>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
